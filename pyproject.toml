[project]
name = "storage-intelligence"
version = "0.1.0"
description = "Intelligent local storage analysis, disk usage profiling, duplicate file detection, and automated safe cleanup workflows."
readme = "README.md"
authors = [
    { name = "Robbie-Truter", email = "timothylang6@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.0.3",
]

[project.scripts]
storage-intelligence = "storage_intelligence.server:main"


[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"




[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bugs/design issues)
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


