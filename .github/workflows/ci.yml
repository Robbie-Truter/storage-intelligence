name: CI

on:
  push:
    branches: [master, refactor/monorepo-structure]
  pull_request:
    branches: [master, refactor/monorepo-structure]

# Cancel outdated workflow runs on open PR updates
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Format, Type Check & Test (${{ matrix.package }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: [mcp-server, backend]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv & Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff Lint Check
        run: uv run ruff check . --output-format=github

      - name: Ruff Format Check
        run: uv run ruff format --check .

      - name: Pyright Type Check
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

      - name: Build Package
        run: uv build

      - name: Test Server Import (mcp-server)
        if: matrix.package == 'mcp-server'
        run: uv run python -c "from storage_intelligence_mcp.server import mcp; print('Server loads OK')"

      - name: Test App Import (backend)
        if: matrix.package == 'backend'
        run: uv run python -c "from storage_intelligence_backend.main import app; print('App loads OK')"
