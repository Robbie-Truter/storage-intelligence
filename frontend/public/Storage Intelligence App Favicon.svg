<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="100%" stop-color="#1c1c1e" />
    </linearGradient>

    <!-- Cyan Accent Lens Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtitle Inset Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Apple Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#metalGrad)" stroke="#3a3a3c" stroke-width="6" filter="url(#subtleShadow)" />

  <!-- Translucent Glass Top-Shine Overlay -->
  <path d="M 32 136 C 32 78.6 78.6 32 136 32 L 376 32 C 433.4 32 480 78.6 480 136 L 480 230 L 32 290 Z" fill="url(#glassGrad)" />

  <!-- Stacked Disk Memory Unit (Storage Metaphor) -->
  <g transform="translate(136, 120)" stroke="#8e8e93" stroke-width="12" stroke-linecap="round" fill="none">
    <!-- Disk Layer 1 -->
    <rect x="0" y="0" width="240" height="56" rx="16" fill="#1c1c1e" stroke="url(#accentGrad)" stroke-width="8" />
    <circle cx="36" cy="28" r="8" fill="#a855f7" stroke="none" />
    <line x1="72" y1="28" x2="180" y2="28" stroke-dasharray="8 8" opacity="0.6" />

    <!-- Disk Layer 2 -->
    <rect x="0" y="80" width="240" height="56" rx="16" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="6" />
    <circle cx="36" cy="108" r="8" fill="#48484a" stroke="none" />
    <line x1="72" y1="108" x2="150" y2="108" opacity="0.4" />

    <!-- Disk Layer 3 -->
    <rect x="0" y="160" width="240" height="56" rx="16" fill="#1c1c1e" stroke="#2c2c2e" stroke-width="6" />
    <circle cx="36" cy="188" r="8" fill="#48484a" stroke="none" />
    <line x1="72" y1="188" x2="190" y2="188" opacity="0.4" />
  </g>

  <!-- Analysis Optical Lens Overlay & AI Spark (Intelligence Metaphor) -->
  <g transform="translate(260, 220)">
    <!-- Scanning Outer Ring -->
    <circle cx="80" cy="80" r="72" fill="none" stroke="url(#accentGrad)" stroke-width="14" filter="url(#glowEffect)" />
    <circle cx="80" cy="80" r="72" fill="rgba(15,23,42,0.75)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

    <!-- AI Spark Geometric Star -->
    <g transform="translate(80, 80) scale(1.1)" opacity="1">
      <!-- Sparkle Core -->
      <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="url(#accentGrad)" />
      <!-- Small secondary sparkles -->
      <circle cx="22" cy="-22" r="5" fill="#a855f7" />
      <circle cx="-20" cy="20" r="3.5" fill="#a855f7" opacity="0.8" />
    </g>
  </g>

  <!-- Subtle Rim Highlight Line -->
  <rect x="35" y="35" width="442" height="442" rx="101" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" pointer-events="none" />
</svg>